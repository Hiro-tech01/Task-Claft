<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="アプリポータル">
<title>アプリポータル</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1b2a1b;color:#fff;font-family:'DotGothic16',ui-monospace,sans-serif}
header{padding:36px 18px 28px;text-align:center;background:linear-gradient(#6ec6ff 0 72%,#1b2a1b 72%)}
h1{font-size:30px;margin:0 0 6px;text-shadow:3px 3px #000}
header p{margin:0;color:#102313;font-size:14px}
main{max-width:760px;margin:0 auto;padding:18px}
h2{font-size:18px;margin:0 0 12px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.app{display:block;min-height:144px;padding:16px;background:#3b3b3b;color:#fff;text-decoration:none;border:4px solid #000;box-shadow:inset 3px 3px #6b6b6b,inset -3px -3px #202020;transition:transform .08s}
.app:hover,.app:focus{transform:translateY(-3px);outline:3px solid #ffd93a}
.icon{font-size:34px}
.app h3{margin:4px 0;font-size:18px}
.app p{margin:0;color:#ddd;font-size:13px}
.badge{display:inline-block;margin-top:12px;padding:3px 8px;background:#5dba2f;border:2px solid #000;font-size:12px}
footer{max-width:760px;margin:0 auto;padding:0 18px 28px;color:#cfe;font-size:12px}
</style>
</head>
<body>
<header>
 <h1>🧱 アプリポータル</h1>
 <p>あそびと毎日のクエストを、ここからはじめよう！</p>
</header>
<main>
 <h2>公開中のアプリ</h2>
 <div class="apps">
  <a class="app" href="./apps/block-quest/">
   <div class="icon">⛏️</div>
   <h3>タスククラフト</h3>
   <p>クエストをクリアして、アイテムを集めよう！</p>
   <span class="badge">あそべるよ！</span>
  </a>
  <a class="app" href="./apps/exit-5/">
   <div class="icon">🚪</div>
   <h3>５番出口</h3>
   <p>通路の異変を見つけて、５番出口をめざそう！</p>
   <span class="badge">あそべるよ！</span>
  </a>
 </div>
</main>
<footer>新しいアプリがふえると、ここに追加されます。</footer>
</body>
</html>
